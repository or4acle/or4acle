name: Update Projects

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Trigger nutracker
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'or4acle',
              repo: 'nutracker',
              workflow_id: 'update.yml',
              ref: 'main'
            })

      - name: Trigger HornyOrNot
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'or4acle',
              repo: 'HornyOrNot',
              workflow_id: 'update.yml',
              ref: 'main'
            })
